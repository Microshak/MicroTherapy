[project]
name = "microtherapy"
version = "0.1.0"
description = "Streaming TTS MCP App — let your coding agent speak to you"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "MicroShak" }
]
keywords = ["mcp", "tts", "text-to-speech", "kokoro", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=2.0.0",
    "kokoro>=0.9.4",
    "uvicorn>=0.34.0",
    "starlette>=0.46.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
microtherapy = "microtherapy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microtherapy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.uv]
# Pin onnxruntime<1.24 for cp310 wheel compatibility.
override-dependencies = [
    "pydantic>=2.12.0",
    "onnxruntime<1.24",
]
